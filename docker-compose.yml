services:
    navisonic:       
        environment:
            - 'NAVI_SKILL_ID=<your-skill-id>'
            - 'NAVI_URL=http://<navidrome_ip>'         # address for AskNavidrome to reach Navidrome 
            - 'NAVI_PORT=4533'                         # port for AskNavidrome to reach Navidrome
            - 'NAVI_PUBLIC_URL=https://yourdomain.com' # optional, address for Alexa to reach Navidrome if different
            - 'NAVI_PUBLIC_PORT=443'                   # optional, port for Alexa to reach Navidrome if different
            - 'ASKNAVI_PATH=/'      # optional base URL path for AskNavidrome, eg https://yourdomain.com/alexa
            - 'NAVI_USER=<username>'
            - 'NAVI_PASS=<password>'
            - 'NAVI_SONG_COUNT=50'
            - 'NAVI_API_PATH=/rest'
            - 'NAVI_API_VER=1.16.1'
            - 'NAVI_DEBUG=1'              
        ports:
            - '5000:5000'
        image: 'ghcr.io/rosskouk/asknavidrome:latest'
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "1"
        deploy:
            restart_policy:
                condition: on-failure
                delay: 5s
                max_attempts: 3
                window: 120s
